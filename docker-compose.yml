# Local development stack. Mirrors the Kubernetes topology: two independent
# services on a shared network, with the frontend proxying /api to the backend.

services:
  backend:
    build:
      context: ./backend
    image: mtb-backend:local
    container_name: mtb-backend
    environment:
      PORT: "4000"
      NODE_ENV: production
      SERVICE_NAME: mtb-backend
      CORS_ORIGIN: "*"
      SEAT_HOLD_TTL_MS: "300000"
      MAX_SEATS_PER_BOOKING: "10"
    ports:
      # Exposed directly so you can curl the API without going through nginx.
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: mtb-frontend:local
    container_name: mtb-frontend
    environment:
      # Service name resolution on the compose network.
      BACKEND_URL: http://backend:4000
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
