# Single public entrypoint in front of both services.
#
# /api goes straight to the backend so API traffic does not take an extra hop
# through nginx; everything else renders the React app. The frontend container
# also proxies /api itself, which keeps port-forwarding to a single pod working
# without an ingress controller.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: movie-booking
  namespace: movie-booking
  labels:
    app.kubernetes.io/part-of: movie-ticket-booking
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
spec:
  ingressClassName: nginx
  rules:
    - host: movies.localhost
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: mtb-backend
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mtb-frontend
                port:
                  number: 80
