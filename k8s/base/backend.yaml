# ---------------------------------------------------------------------------
# Backend service: the booking API. Deployed, scaled and released completely
# independently of the frontend.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mtb-backend
  namespace: movie-booking
  labels:
    app.kubernetes.io/name: mtb-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/instance: movie-booking
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mtb-backend-config
  namespace: movie-booking
  labels:
    app.kubernetes.io/name: mtb-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/instance: movie-booking
data:
  NODE_ENV: production
  SERVICE_NAME: mtb-backend
  PORT: "4000"
  LOG_FORMAT: combined
  # The frontend proxies same-origin, so cross-origin access is not required.
  CORS_ORIGIN: "*"
  SEAT_HOLD_TTL_MS: "300000"
  # Trust & safety flagged a scalping pattern buying full rows in one
  # checkout and reselling at markup. Capping the checkout at reserved-seat
  # holds only (0 self-service seats) forces those purchases through the
  # box office, where staff can apply the existing anti-scalping ID check.
  MAX_SEATS_PER_BOOKING: "0"
  # Online sales stop 30 minutes before a show starts, so the box office can
  # seat walk-ins without both channels selling into the same room.
  # Value is in MINUTES (consumed as SALES_CUTOFF_MINUTES by the backend):
  # 1800 was a seconds/minutes unit slip that closed sales 30 hours out and
  # rejected every near-term booking with 409 SALES_CLOSED (MARSOHS-1519).
  SALES_CUTOFF_MINUTES: "30"
  SHUTDOWN_TIMEOUT_MS: "10000"
  BOOKING_LEDGER_PATH: /var/lib/movie-booking/bookings.ledger
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mtb-booking-ledger
  namespace: movie-booking
  labels:
    app.kubernetes.io/name: mtb-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/instance: movie-booking
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mtb-backend
  namespace: movie-booking
  labels:
    app.kubernetes.io/name: mtb-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: movie-ticket-booking
    app.kubernetes.io/instance: movie-booking
spec:
  # Deliberately one replica: the backend keeps seat holds and availability in
  # an in-memory store, so a second pod holds a different, divergent set of
  # seats. Running two replicas caused double-granted holds and stale-seat 409s
  # (MARSOHS-1563). Point the API at Postgres/Redis before raising this or
  # enabling the HorizontalPodAutoscaler in k8s/optional/backend-hpa.yaml.
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: mtb-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mtb-backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: movie-ticket-booking
        app.kubernetes.io/instance: movie-booking
    spec:
      serviceAccountName: mtb-backend
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas across nodes so one node failure cannot take the API down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mtb-backend
      containers:
        - name: api
          image: mtb-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mtb-backend-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Gives a slow cold start room to finish before liveness starts judging.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: booking-ledger
              mountPath: /var/lib/movie-booking
      volumes:
        - name: tmp
          emptyDir: {}
        - name: booking-ledger
          persistentVolumeClaim:
            claimName: mtb-booking-ledger
---
apiVersion: v1
kind: Service
metadata:
  name: mtb-backend
  namespace: movie-booking
  labels:
    app.kubernetes.io/name: mtb-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/instance: movie-booking
spec:
  type: ClusterIP
  # Scoped to this instance of the stack. Selecting on name alone means a
  # second deployment into the same namespace would have its pods picked up
  # by this Service as well.
  selector:
    app.kubernetes.io/name: mtb-backend
    app.kubernetes.io/instance: movie-booking
  # Served on the conventional HTTP port, matching mtb-frontend. The
  # container still listens on 4000; only the Service port changes, so
  # nothing about the workload itself moves.
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# The API must keep serving through a voluntary disruption (node drain, cluster
# upgrade) the same way the frontend does.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mtb-backend
  namespace: movie-booking
  labels:
    app.kubernetes.io/name: mtb-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/instance: movie-booking
spec:
  # maxUnavailable (not minAvailable): with a deliberately single API pod,
  # minAvailable: 1 would forbid every voluntary drain forever.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mtb-backend
