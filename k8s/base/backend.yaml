# ---------------------------------------------------------------------------
# Backend service: the booking API. Deployed, scaled and released completely
# independently of the frontend.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mtb-backend
  namespace: movie-booking
  labels:
    app.kubernetes.io/name: mtb-backend
    app.kubernetes.io/component: backend
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mtb-backend-config
  namespace: movie-booking
  labels:
    app.kubernetes.io/name: mtb-backend
    app.kubernetes.io/component: backend
data:
  NODE_ENV: production
  SERVICE_NAME: mtb-backend
  PORT: "4000"
  LOG_FORMAT: combined
  # The frontend proxies same-origin, so cross-origin access is not required.
  CORS_ORIGIN: "*"
  SEAT_HOLD_TTL_MS: "300000"
  MAX_SEATS_PER_BOOKING: "10"
  SHUTDOWN_TIMEOUT_MS: "10000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mtb-backend
  namespace: movie-booking
  labels:
    app.kubernetes.io/name: mtb-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: movie-ticket-booking
spec:
  # Deliberately one replica: the reference backend keeps bookings in an
  # in-memory store, so a second pod would hold a different set of seats and
  # bookings. Recreate avoids exposing both stores during a rollout. Point
  # the API at Postgres/Redis before raising this or enabling the
  # HorizontalPodAutoscaler in k8s/optional/backend-hpa.yaml.
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mtb-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mtb-backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: movie-ticket-booking
    spec:
      serviceAccountName: mtb-backend
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas across nodes so one node failure cannot take the API down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mtb-backend
      containers:
        - name: api
          image: mtb-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mtb-backend-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Gives a slow cold start room to finish before liveness starts judging.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mtb-backend
  namespace: movie-booking
  labels:
    app.kubernetes.io/name: mtb-backend
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mtb-backend
  ports:
    - name: http
      port: 4000
      targetPort: http
      protocol: TCP
