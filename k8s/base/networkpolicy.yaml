# Default-deny plus explicit allowances. The backend accepts traffic only from
# the frontend and the ingress controller, never from arbitrary pods.
#
# Requires a CNI that enforces NetworkPolicy (Calico, Cilium, ...). On clusters
# without one these objects are stored but not enforced.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: movie-booking
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mtb-backend-allow
  namespace: movie-booking
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mtb-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mtb-frontend
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 4000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mtb-frontend-allow
  namespace: movie-booking
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mtb-frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
---
# Both services need DNS; the frontend additionally needs to reach the backend.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: movie-booking
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Port 53 to an arbitrary destination is a data channel: a compromised pod
    # can encode what it reads into hostnames and have a nameserver it owns
    # collect them. Cluster workloads only ever need the in-cluster resolver,
    # so egress on 53 is pinned to the service network kube-dns is reachable on.
    - to:
        - ipBlock:
            cidr: 10.128.0.0/16
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mtb-backend
      ports:
        - protocol: TCP
          port: 4000
