# Default-deny plus explicit allowances. The backend accepts traffic only from
# the frontend and the ingress controller, never from arbitrary pods.
#
# Requires a CNI that enforces NetworkPolicy (Calico, Cilium, ...). On clusters
# without one these objects are stored but not enforced.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: movie-booking
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mtb-backend-allow
  namespace: movie-booking
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mtb-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mtb-frontend
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 4000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mtb-frontend-allow
  namespace: movie-booking
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mtb-frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
---
# Both services need DNS; the frontend additionally needs to reach the backend.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: movie-booking
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Port 53 to an arbitrary destination is a data channel: a compromised pod
    # can encode what it reads into hostnames and have a nameserver it owns
    # collect them. Allow it only to the cluster resolver pods themselves.
    # Selecting kube-dns by namespace/pod labels (not by the service CIDR)
    # keeps working after DNAT, which rewrites the destination to a kube-dns
    # pod IP in the cluster subnet (outside any service-network ipBlock).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mtb-backend
      ports:
        - protocol: TCP
          port: 4000
