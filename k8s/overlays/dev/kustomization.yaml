apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local clusters (OrbStack, kind, minikube, Docker Desktop): images are built
# straight into the node's image store, so nothing is pulled from a registry.
namespace: movie-booking

resources:
  - ../../base

images:
  - name: mtb-backend
    newTag: local
  - name: mtb-frontend
    newTag: local

patches:
  # One replica each keeps a laptop cluster light.
  - target:
      kind: Deployment
      name: mtb-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # HPAs fight with fixed replica counts and need metrics-server, which local
  # clusters often lack.
  - target:
      kind: HorizontalPodAutoscaler
      name: mtb-frontend
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: mtb-frontend
  - target:
      kind: PodDisruptionBudget
      name: mtb-frontend
    patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: mtb-frontend
