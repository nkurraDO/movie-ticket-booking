apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# DigitalOcean Kubernetes (DOKS) with images in DigitalOcean Container Registry.
namespace: movie-booking

resources:
  - ../../base

# The DOCR Starter tier allows a single repository, so both services live in
# one repository and are told apart by tag rather than by name.
images:
  - name: mtb-backend
    newName: registry.digitalocean.com/managed-agents-demo-v2/movie-ticket-booking
    newTag: backend-1.0.0
  - name: mtb-frontend
    newName: registry.digitalocean.com/managed-agents-demo-v2/movie-ticket-booking
    newTag: frontend-1.0.0

patches:
  # Pods use dedicated ServiceAccounts, so the DOCR credentials have to be
  # attached to the pod spec directly. Create the secret out of band (doctl
  # names it "registry-<registry>", which is what these patches reference):
  #   doctl registry kubernetes-manifest --namespace movie-booking | kubectl apply -f -
  - target:
      kind: Deployment
      name: mtb-backend
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: registry-managed-agents-demo-v2
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: mtb-frontend
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: registry-managed-agents-demo-v2
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent

  # Write the booking ledger to the node's audit path rather than the default
  # under /tmp. /tmp is an emptyDir, so it is discarded whenever the container
  # is replaced -- which is how the ledger for confirmed bookings was lost
  # during the restarts in the availability-audit incident. Customer-facing
  # sales records should outlive a single container.
  - target:
      kind: ConfigMap
      name: mtb-backend-config
    patch: |-
      - op: add
        path: /data/BOOKING_LEDGER_PATH
        value: /var/audit/movie-booking/bookings.ledger

  # Keep the frontend proxy pointed at the backend Service deployed by this
  # overlay. The Ingress sends /api traffic to the frontend, so this value is
  # the path all public API requests use to reach the backend.
  - target:
      kind: ConfigMap
      name: mtb-frontend-config
    patch: |-
      - op: replace
        path: /data/BACKEND_URL
        value: http://mtb-backend.movie-booking.svc.cluster.local:4000

  # No DNS name is pointed at the Load Balancer yet, so serve every host and
  # reach the app on the Load Balancer's public IP. Set a host here once DNS
  # exists, which is also what makes TLS via cert-manager possible.
  #
  # The separate /api route is dropped so the frontend owns API proxying on a
  # single path, instead of the Ingress and nginx each having a say.
  - target:
      kind: Ingress
      name: movie-booking
    patch: |-
      - op: remove
        path: /spec/rules/0/host
      - op: remove
        path: /spec/rules/0/http/paths/0
