apiVersion: batch/v1
kind: CronJob
metadata:
  name: booking-journey-probe
  namespace: monitoring
  labels:
    app.kubernetes.io/name: booking-journey-probe
    app.kubernetes.io/part-of: movie-ticket-booking
spec:
  schedule: "*/1 * * * *"
  # A probe run that overruns its minute is a signal in itself; starting a
  # second one on top of it would only add noise.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # One attempt per schedule tick. Retrying would paper over a real
      # customer-visible failure that happened on the first try.
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: booking-journey-probe
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: probe
              image: python:3.12-alpine
              command: ["python3", "/probe/probe.py"]
              env:
                - name: ENVIRONMENT
                  value: production
                # Deliberately targets the frontend rather than the backend
                # Service. Customers reach the API through the frontend's nginx
                # proxy, so probing that path also covers the proxy config and
                # the frontend's view of where the backend lives.
                - name: PROBE_TARGET
                  value: http://mtb-frontend.movie-booking.svc.cluster.local
                - name: PROBE_TIMEOUT_SECONDS
                  value: "10"
                - name: JIRA_ISSUE_TYPE
                  value: Bug
                - name: JIRA_RENOTIFY_MINUTES
                  value: "30"
              # Optional so the probe still runs (and logs what it would file)
              # before the Jira credentials are in place.
              envFrom:
                - secretRef:
                    name: jira-credentials
                    optional: true
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: probe
                  mountPath: /probe
                  readOnly: true
          volumes:
            - name: probe
              configMap:
                name: booking-journey-probe-script
