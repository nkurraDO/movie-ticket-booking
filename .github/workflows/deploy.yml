name: Deploy to DOKS

# Merges to main are the only way code reaches a cluster.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys race each other onto the same cluster. The group
# covers the whole promotion, so a newer merge waits rather than overtaking a
# release that is already part-way to production.
concurrency:
  group: deploy-doks
  cancel-in-progress: false

env:
  DOCR_REPO: registry.digitalocean.com/managed-agents-demo-v2/movie-ticket-booking

jobs:
  # Images are built exactly once and then promoted by digest-equivalent tag,
  # so production runs the same bits pre-production was checked on. Rebuilding
  # per environment would defeat the point of having a pre-production stage.
  build:
    name: build and push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      # Exchanges the API token for short-lived read/write registry
      # credentials. Preferred over passing the raw token to docker login,
      # because this path is governed by the registry:read scope and so works
      # with a least-privilege custom-scoped token.
      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1800

      - uses: docker/setup-buildx-action@v3

      # Cluster nodes are amd64, so linux/amd64 is explicit rather than
      # inherited from whatever the runner happens to be.
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: ${{ env.DOCR_REPO }}:backend-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: ${{ env.DOCR_REPO }}:frontend-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # Pre-production first. It is built to the same shape as production, so a
  # change that cannot survive here should never reach customers.
  preprod:
    name: pre-production
    needs: build
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: preprod
      cluster_id: ${{ vars.PREPROD_CLUSTER_ID }}
      overlay: k8s/overlays/preprod
    secrets:
      do_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

  # Production only runs if pre-production rolled out cleanly.
  prod:
    name: production
    needs: preprod
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: production
      cluster_id: ${{ vars.DOKS_CLUSTER_ID }}
      overlay: k8s/overlays/doks
    secrets:
      do_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
