name: Deploy to DOKS

# Merges to main are the only way code reaches the cluster.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys race each other onto the same cluster.
concurrency:
  group: deploy-doks
  cancel-in-progress: false

env:
  DOCR_REPO: registry.digitalocean.com/managed-agents-demo/movie-ticket-booking
  NAMESPACE: movie-booking

jobs:
  deploy:
    name: build and deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      # DOCR accepts the API token as both username and password.
      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          password: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Cluster nodes are amd64, so linux/amd64 is explicit rather than
      # inherited from whatever the runner happens to be.
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: ${{ env.DOCR_REPO }}:backend-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: ${{ env.DOCR_REPO }}:frontend-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # Short-lived credentials minted per run, so no kubeconfig is stored.
      - name: Save cluster credentials
        run: doctl kubernetes cluster kubeconfig save "${{ vars.DOKS_CLUSTER_ID }}" --expiry-seconds 900

      - name: Ensure namespace and registry pull secret
        run: |
          kubectl apply -f k8s/base/namespace.yaml
          doctl registry kubernetes-manifest --namespace "$NAMESPACE" | kubectl apply -f -

      - name: Install kustomize
        run: |
          curl -sSfL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo install -m 0755 kustomize /usr/local/bin/kustomize

      # Pinning to the commit SHA makes every deploy immutable and traceable:
      # the running image can always be mapped back to the commit that built
      # it, and a redeploy can never silently pick up different bits.
      - name: Pin images to this commit
        working-directory: k8s/overlays/doks
        run: |
          kustomize edit set image "mtb-backend=${DOCR_REPO}:backend-${GITHUB_SHA}"
          kustomize edit set image "mtb-frontend=${DOCR_REPO}:frontend-${GITHUB_SHA}"

      - name: Apply manifests
        run: kubectl apply -k k8s/overlays/doks

      - name: Wait for rollout
        run: |
          kubectl -n "$NAMESPACE" rollout status deploy/mtb-backend  --timeout=300s
          kubectl -n "$NAMESPACE" rollout status deploy/mtb-frontend --timeout=300s

      # Runs from inside a frontend pod on purpose. The load balancer is
      # firewalled to a single source IP, so an external probe from a runner
      # would fail for reasons unrelated to the health of the release.
      #
      # Non-blocking today: flip continue-on-error to false (or add a rollback
      # step) once you want a bad release to fail the pipeline.
      - name: Smoke test
        id: smoke
        continue-on-error: true
        run: |
          set -o pipefail
          echo "Checking the API through the frontend proxy..."
          kubectl -n "$NAMESPACE" exec deploy/mtb-frontend -c web -- \
            wget -qO- --timeout=8 http://127.0.0.1:8080/api/movies | head -c 200
          echo
          echo "Checking that the static app is served..."
          kubectl -n "$NAMESPACE" exec deploy/mtb-frontend -c web -- \
            wget -qO- --timeout=8 http://127.0.0.1:8080/healthz

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deployed \`${GITHUB_SHA:0:7}\` to \`$NAMESPACE\`"
            echo
            echo "| Component | Image |"
            echo "| --- | --- |"
            echo "| backend | \`${DOCR_REPO}:backend-${GITHUB_SHA}\` |"
            echo "| frontend | \`${DOCR_REPO}:frontend-${GITHUB_SHA}\` |"
            echo
            echo "Smoke test: **${{ steps.smoke.outcome }}**"
            echo
            kubectl -n "$NAMESPACE" get deploy,pods 2>&1 | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
